; BIOMEC UMA · ESP32-WROOM de la MANO (control por ESP-NOW desde la app)
; Abre ESTA carpeta en VS Code con PlatformIO.
;
; pioarduino = core Arduino 3.x (ledcAttach). Versión fija para todos los ordenadores.
; La WROOM de la mano no entra sola en modo descarga: mantén pulsado BOOT al
; empezar a subir. Si hay varias placas enchufadas, añade upload_port = COMx.

[env:mano]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board = esp32dev
lib_deps =
    madhephaestus/ESP32Servo@^3.0.6
