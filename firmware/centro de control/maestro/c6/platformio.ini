; BIOMEC UMA · ESP32-C6 PUENTE (USB <-> ESP-NOW) y receptor EMG
; Abre ESTA carpeta en VS Code con PlatformIO y elige el entorno de tu placa.
;
; pioarduino = core Arduino 3.x (el platform oficial "espressif32" trae el 2.x y
; este código no compila con él). Versión fija para que compile igual en todos
; los ordenadores. Si hay varias placas enchufadas, añade upload_port = COMx.

[platformio]
default_envs = devkitc

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-C6-DevKitC-1 del puente (MAC AC:EB:E6:00:55:B4)
[env:devkitc]
board = esp32-c6-devkitc-1

; Waveshare ESP32-C6-Zero del receptor EMG del equipo (MAC AC:EB:E6:2C:D7:DC):
; mismos ajustes de placa que firmware/maestro
[env:c6zero]
board = esp32-c6-devkitm-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
upload_speed = 460800
